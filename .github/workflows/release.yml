name: Release
on:
  push:
    tags: ["v*"]

jobs:
  release:
    uses: DoanNguyenTrong/kindle-primitive-build/.github/workflows/package.yml@9533d481058f4d67b29568f40b30017ddcb32c8e
    permissions:
      contents: write
    with:
      id: primitive-store
      dir: store
      binary-crate: store-app
      arches: armhf
      firmware-min: "5.16.3"
      docs-licence-file: LICENSE-DOCS
    secrets:
      package-scan-patterns: ${{ secrets.PACKAGE_SCAN_PATTERNS }}
